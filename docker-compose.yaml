services:
  database:
    image: postgres:17
    container_name: database
    ports:
      - 5432:5432
    env_file:
      - ./Secrets/.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    user: "1000:1000"
    env_file:
      - ./Secrets/.env
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - /app/.venv
    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    user: "1000:1000"
    environment:
      # Used by the browser, so it must be the host address, not "backend"
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules 
      - /app/.next

  redis:
    image: redis:8-alpine
    container_name: redis
    command: [ "redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    container_name: storage
    env_file:
      - ./Secrets/.env
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    


volumes:
  pg_data:
  redis_data:
  storage_data: