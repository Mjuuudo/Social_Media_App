services:
  database:
    image: postgres:17
    container_name: database
    ports:
      - 5432:5432
    env_file:
      - ./Secrets/.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    user: "1000:1000"
    env_file:
      - ./Secrets/.env
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    user: "1000:1000"
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules 


volumes:
  pg_data: