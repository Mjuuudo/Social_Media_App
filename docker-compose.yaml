services:
  database:
    image: postgres:17
    container_name: database
    ports:
      - 5432:5432
    env_file:
      - ./Secrets/.env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    user: "1000:1000"
    env_file:
      - ./Secrets/.env
    ports:
      - 8000:8000
    volumes:
      - ./backend:/app
      - /app/.venv
    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    user: "1000:1000"
    environment:
      # Used by the browser, so it must be the host address, not "backend"
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - 3000:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules 
      - /app/.next
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=Fun@2026
    volumes:
      - ./data:/data
      - ./logs:/logs
    healthcheck:
      test: ["CMD", "sh","-c","curl -f http://localhost:9000/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s


volumes:
  pg_data: