name: CI

on:
    push:
    pull_request:
        branches: [master]
jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        env:
            POSTGRES_HOST: localhost
            POSTGRES_USER: ci
            POSTGRES_PASSWORD: ci
            POSTGRES_DB: ci
            JWT_SECRET: ci-only-not-a-real-secret
        steps:
            - uses: actions/checkout@7
            - uses: astral-sh/setup-uv@7
              with:
                enable-cache: true
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run pytest -v
